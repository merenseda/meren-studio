<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meren Studio - No-Code Görsel Web Tasarımcısı</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Üst Başlık & Eylem Çubuğu -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-badge">
          <span class="brand-icon">💎</span>
          <span class="brand-text">Meren <strong>Studio</strong></span>
          <span class="format-pill">No-Code</span>
        </div>
        <div class="doc-title-wrapper">
          <input type="text" id="docTitleInput" class="doc-title-input" value="Başlıksız No-Code Dokümanı" title="Doküman Başlığı">
          <span id="saveStatusDot" class="status-dot saved" title="Kaydedildi"></span>
        </div>
      </div>

      <div class="header-center">
        <button id="btnTogglePreview" class="mode-toggle-btn" title="Canlı Önizleme Modunu Aç/Kapat">
          <span class="toggle-icon">👁️</span> <span id="previewBtnText">Önizleme Modu</span>
        </button>
      </div>

      <div class="header-right">
        <button id="btnNew" class="action-btn" title="Yeni Doküman (Ctrl+N)">
          <span>➕</span> Yeni
        </button>
        <button id="btnOpen" class="action-btn" title=".hrav Dosyası Aç (Ctrl+O)">
          <span>📂</span> Aç
        </button>
        <button id="btnSave" class="action-btn primary" title="Kaydet (Ctrl+S)">
          <span>💾</span> Kaydet
        </button>
        <button id="btnSaveAs" class="action-btn" title="Farklı Kaydet">
          <span>📥</span> Farklı Kaydet
        </button>
        <button id="btnExportHtml" class="action-btn outline" title="Standart HTML Olarak Dışa Aktar">
          <span>🌐</span> HTML Export
        </button>
      </div>
    </header>

    <!-- Ana 3 Panelli Çalışma Alanı -->
    <main class="studio-workspace" id="studioWorkspace">
      
      <!-- SOL PANEL: Zengin Bileşen Paleti -->
      <aside class="sidebar-palette" id="sidebarPalette">
        <div class="palette-header">
          <h3>Bileşen Kütüphanesi</h3>
          <input type="text" id="componentSearch" class="palette-search-input" placeholder="Bileşen ara (Örn: Sayaç, Tablo)...">
        </div>

        <div class="palette-categories" id="paletteCategories">
          <!-- Dinamik Olarak components.js ile Doldurulur -->
        </div>
      </aside>

      <!-- ORTA PANEL: Görsel Çalışma Tuvali (Canvas) -->
      <section class="canvas-viewport" id="canvasViewport">
        <div class="canvas-page-wrapper">
          <div class="visual-canvas" id="visualCanvas">
            <!-- Dinamik No-Code Blokları -->
          </div>
        </div>
      </section>

      <!-- SAĞ PANEL: Görsel Stil & Özellik Denetçisi (Inspector) -->
      <aside class="sidebar-inspector" id="sidebarInspector">
        <!-- Dinamik Olarak inspector.js ile Doldurulur -->
      </aside>

    </main>

    <!-- Alt Durum Çubuğu -->
    <footer class="app-statusbar">
      <div class="statusbar-left">
        <span class="status-badge secure">
          <span>🔒</span> AES-256-GCM (.hrav Otomatik Şifreli)
        </span>
        <span class="status-item" id="filePathStatus">Yeni Belge (Henüz Kaydedilmedi)</span>
      </div>
      <div class="statusbar-right">
        <span class="status-item" id="blockCountStatus">0 Bileşen</span>
        <span class="status-item" id="fileSizeStatus">Boyut: ~0 B</span>
        <span class="status-item ready-status">● Sistem Hazır</span>
      </div>
    </footer>
  </div>

  <!-- JavaScript Modülleri -->
  <script src="components.js"></script>
  <script src="noCodeEngine.js"></script>
  <script src="inspector.js"></script>
  <script src="app.js"></script>
</body>
</html>
