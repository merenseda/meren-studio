<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meren Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Üst Başlık & Araç Çubuğu -->
    <header class="app-header">
      <div class="header-left">
        <!-- Sol Menü Aç / Kapa Butonu -->
        <button id="btnToggleLeftSidebar" class="icon-toggle-btn" title="Sol Menüyü Gizle / Göster (Ctrl+B)">
          <span class="toggle-icon">◀</span>
        </button>

        <!-- Doküman Başlığı ve Format Seçici -->
        <div class="doc-title-wrapper">
          <input type="text" id="docTitleInput" class="doc-title-input" value="yeni meren dosyası" placeholder="Dosya adı..." title="Doküman Adı">
          <select id="docFormatSelect" class="doc-format-select" title="Kayıt Formatı (.meren / .hrav)">
            <option value="meren" selected>.meren</option>
            <option value="hrav">.hrav</option>
          </select>
          <span id="saveStatusDot" class="status-dot saved" title="Kaydedildi"></span>
        </div>

        <!-- Geri Al / Yinele Butonları -->
        <div class="history-btn-group">
          <button id="btnUndo" class="action-btn icon-only" title="Geri Al (Ctrl+Z)"><span>↩️</span></button>
          <button id="btnRedo" class="action-btn icon-only" title="Yinele (Ctrl+Y / Ctrl+Shift+Z)"><span>↪️</span></button>
        </div>

        <!-- Otomatik Kaydetme Anahtarı -->
        <div class="auto-save-toggle-wrap" title="Dosya bir yere kayıtlıysa değişiklikleri otomatik olarak kaydeder">
          <label class="switch">
            <input type="checkbox" id="chkAutoSave">
            <span class="slider-toggle round"></span>
          </label>
          <span class="auto-save-label">Oto. Kaydet</span>
        </div>
      </div>

      <div class="header-right">
        <button id="btnToggleSearch" class="action-btn" title="Sayfa İçi Arama (Ctrl+F)">
          <span>🔍</span> Ara
        </button>
        <button id="btnNew" class="action-btn" title="Yeni Boş Doküman (Ctrl+N)">
          <span>➕</span> Yeni
        </button>
        <button id="btnOpen" class="action-btn" title="Dosya Aç (Ctrl+O)">
          <span>📂</span> Aç
        </button>
        <button id="btnSave" class="action-btn primary" title="Kaydet (Ctrl+S)">
          <span>💾</span> Kaydet
        </button>
        <button id="btnSaveAs" class="action-btn" title="Farklı Kaydet">
          <span>📥</span> Farklı Kaydet
        </button>
        <button id="btnPrintPdf" class="action-btn outline" title="Yazdır veya PDF Olarak Kaydet (Ctrl+P)">
          <span>🖨️</span> Yazdır / PDF
        </button>

        <!-- Sağ Denetçi Aç / Kapa Butonu (Başlangıçta Kapalı) -->
        <button id="btnToggleRightSidebar" class="icon-toggle-btn panel-closed" title="Sağ Denetçiyi Göster / Gizle">
          <span class="toggle-icon">◀</span>
        </button>
      </div>
    </header>

    <!-- Zengin Metin Biçimlendirme Araç Çubuğu (Floating Rich Text Toolbar) -->
    <div class="rich-text-floating-toolbar" id="richTextToolbar" style="display: none;">
      <button class="rich-btn" data-command="bold" title="Kalın (Ctrl+B)"><b>B</b></button>
      <button class="rich-btn" data-command="italic" title="İtalik (Ctrl+I)"><i>I</i></button>
      <button class="rich-btn" data-command="underline" title="Altı Çizili (Ctrl+U)"><u>U</u></button>
      <button class="rich-btn" data-command="strikeThrough" title="Üstü Çizili"><s>S</s></button>
      <span class="rich-divider"></span>
      <button class="rich-btn" data-command="insertUnorderedList" title="Madde İşaretli Liste">• Liste</button>
      <button class="rich-btn" data-command="removeFormat" title="Biçimi Temizle">🧹</button>
    </div>

    <!-- Ctrl+F Sayfa İçi Arama Çubuğu -->
    <div class="search-floating-bar" id="searchFloatingBar" style="display: none;">
      <span class="search-icon">🔍</span>
      <input type="text" id="canvasSearchInput" placeholder="Sayfa içinde ara... (Enter / Esc)" autocomplete="off">
      <span id="searchResultCount" class="search-count">0/0</span>
      <button id="btnSearchPrev" class="search-nav-btn" title="Önceki (Shift+Enter)">▲</button>
      <button id="btnSearchNext" class="search-nav-btn" title="Sonraki (Enter)">▼</button>
      <button id="btnSearchClose" class="search-nav-btn close-btn" title="Kapat (Esc)">✕</button>
    </div>

    <!-- Word Benzeri Korumalı Görünüm Şeridi -->
    <div class="protected-view-banner" id="protectedViewBanner" style="display: none;">
      <div class="banner-left-info">
        <span class="banner-shield-icon">🛡️</span>
        <div class="banner-text-block">
          <strong>KORUMALI GÖRÜNÜM:</strong> Bu dosya kaza eseri silinmeye veya değiştirilmeye karşı korumak için <u>salt okunur</u> açıldı.
        </div>
      </div>
      <button class="enable-edit-btn" id="btnEnableEditing">
        <span>✏️</span> Düzenlemeyi Etkinleştir
      </button>
    </div>

    <!-- Ana 3 Panelli Stüdyo -->
    <main class="studio-workspace" id="studioWorkspace">
      
      <!-- SOL: Bileşen Paleti -->
      <aside class="sidebar-palette" id="sidebarPalette">
        <div class="palette-header">
          <div class="panel-header-title-row">
            <h3>Bileşenler</h3>
            <button class="mini-collapse-btn" id="btnCollapseLeft" title="Menüyü Daralt">◀</button>
          </div>
          <input type="text" id="componentSearch" class="palette-search-input" placeholder="Bileşen ara...">
        </div>

        <div class="palette-categories" id="paletteCategories">
          <!-- components.js ile doldurulur -->
        </div>
      </aside>

      <!-- SOL RESIZER -->
      <div class="resizer-handle resizer-left" id="resizerLeft" title="Genişliği ayarlamak için sürükleyin"></div>

      <!-- ORTA: Tuval -->
      <section class="canvas-viewport" id="canvasViewport">
        <div class="canvas-page-wrapper">
          <div class="visual-canvas" id="visualCanvas">
            <!-- Program açıldığında tamamen boş başlar -->
          </div>
        </div>
      </section>

      <!-- SAĞ RESIZER -->
      <div class="resizer-handle resizer-right" id="resizerRight" title="Genişliği ayarlamak için sürükleyin"></div>

      <!-- SAĞ: Denetçi (Başlangıçta İÇERİDE / KAPALI) -->
      <aside class="sidebar-inspector collapsed" id="sidebarInspector">
        <!-- inspector.js ile doldurulur -->
      </aside>

    </main>

    <!-- Alt Durum Çubuğu -->
    <footer class="app-statusbar">
      <div class="statusbar-left">
        <span class="status-badge secure">
          <span>🔒</span> AES-256-GCM Şifreli
        </span>
        <span class="status-item" id="filePathStatus">Yeni Belge (Henüz Kaydedilmedi)</span>
      </div>
      <div class="statusbar-right">
        <span class="status-item" id="blockCountStatus">0 Bileşen</span>
        <span class="status-item" id="modeStatusBadge">✏️ Düzenleme Modu</span>
        <span class="status-item ready-status">● Sistem Hazır</span>
      </div>
    </footer>
  </div>

  <script src="components.js"></script>
  <script src="noCodeEngine.js"></script>
  <script src="inspector.js"></script>
  <script src="app.js"></script>
</body>
</html>
